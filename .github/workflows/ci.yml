name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/tinyowl

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Security audit (pip-audit)
        # --path audits only pyproject.toml runtime deps, not dev tools or pip itself
        run: pip-audit --path . --ignore-vuln GHSA-r9dj-hf24-4xgm

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TINYOWL_API_KEY: ${{ secrets.TINYOWL_API_KEY }}
      TINYOWL_PROJECT_SECRET: ${{ secrets.TINYOWL_PROJECT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke test
        run: python examples/basic.py
