name: Release

# Single combined workflow: read version from pyproject.toml → check tag + PyPI
# → test → build → tag → publish.
#
# Why one job: GITHUB_TOKEN tag pushes do NOT trigger downstream workflows, so
# the separate auto-tag → publish.yml chain never fires. Mirrors tiny-owl-js/release.yml.
#
# Skip logic:
#   tag exists + PyPI has it   → no-op (idempotent)
#   tag exists + PyPI missing  → retry publish only (handles publish failures)
#   tag missing                → full flow: test → build → tag → publish

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch: # allow manual retry

permissions:
  contents: write  # create + push git tag
  id-token: write  # PyPI OIDC Trusted Publishing

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinyowl-observability

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: pkg
        run: |
          VERSION=$(python3 -c "
          import re, pathlib
          m = re.search(r'^version\s*=\s*\"(.+?)\"', pathlib.Path('pyproject.toml').read_text(), re.M)
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version is already on PyPI
        id: pypi_check
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/tinyowl-observability/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (already tagged and on PyPI)
        if: steps.tag_check.outputs.exists == 'true' && steps.pypi_check.outputs.published == 'true'
        run: echo "${{ steps.pkg.outputs.tag }} is already on GitHub and PyPI — nothing to do."

      - name: Install dependencies
        if: steps.pypi_check.outputs.published == 'false'
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.pypi_check.outputs.published == 'false'
        run: pytest tests/ -v --tb=short

      - name: Build sdist and wheel
        if: steps.pypi_check.outputs.published == 'false'
        run: python -m build

      - name: Verify distribution
        if: steps.pypi_check.outputs.published == 'false'
        run: twine check dist/*

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        if: steps.pypi_check.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
