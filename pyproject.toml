[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyowl-observability"
version = "0.1.1"
description = "TinyOwl Python SDK - Lightweight observability and event logging with enterprise-grade HMAC security"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TinyOwl - Vladimir Rancic", email = "vladimir.rancic@np011.se" }]
keywords = ["observability", "logging", "monitoring", "tinyowl", "hmac", "security", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-requests>=2.31",
    "pip-audit>=2.6",
]

[project.urls]
Homepage = "https://tiny-owl-kit.io"
Repository = "https://github.com/tiny-owl-kit/tiny-owl-python"
Issues = "https://github.com/tiny-owl-kit/tiny-owl-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyowl"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tinyowl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
